name: Logistic Regression App Cloud Compat

on:
  push:
    paths:
      - "streamlit_apps/logistic_regression_app/**"
      - ".github/workflows/logistic-regression-app-cloud-compat.yml"
  pull_request:
    paths:
      - "streamlit_apps/logistic_regression_app/**"
      - ".github/workflows/logistic-regression-app-cloud-compat.yml"

jobs:
  compat-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run cloud compatibility checks
        run: bash streamlit_apps/logistic_regression_app/scripts/cloud_compat_check.sh
