[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ml-classification-study-app"
version = "0.1.0"
description = "Streamlit app to explore ML classification models on synthetic 2D datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name"}]

dependencies = [
  "streamlit>=1.32",
  "plotly>=5.20",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_classification_study"]
