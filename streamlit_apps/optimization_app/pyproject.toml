[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-app"
version = "0.1.0"
description = "Interactive Streamlit app for exploring and practicing optimization algorithms"
authors = [{ name = "jparisu", email = "javier.paris.u@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["optimization", "streamlit", "education", "interactive"]

dependencies = [
    "streamlit>=1.35.0",
    "numpy>=1.26.0",
    "sympy>=1.12",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.urls]
Repository = "https://github.com/jparisu/CUNEF-Resources"

[project.scripts]
optimization-app = "app:main"

[tool.setuptools]
py-modules = ["app"]

# ---------------------------------------------------------------------------
# Ruff – linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long – handled by formatter
    "B008",   # do not perform function calls in default arguments (common in Streamlit)
]

[tool.ruff.lint.per-file-ignores]
"optimizers/*.py" = ["ARG002"]   # unused interface parameters in optimizer overrides

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pyright – static type checker
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app.py", "core", "optimizers", "ui"]
exclude = ["**/__pycache__"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Setuptools – package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "optimizers*", "ui*"]
